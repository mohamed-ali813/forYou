<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أتمنى أن تبتهجي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --blush: #f9c5d1;
            --rose: #e8849a;
            --deep-rose: #c9556b;
            --petal: #fde8ee;
            --cream: #fff8f9;
            --gold: #e8c49a;
            --text: #6b3a4a;
            --text-light: #b07888;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: #fce8f0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ──── ANIMATED BACKGROUND ──── */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .bg-gradient {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, #fde3ee 0%, transparent 60%),
                radial-gradient(ellipse 70% 70% at 80% 90%, #fdd5e8 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 60% 40%, #fff0f5 0%, transparent 50%),
                linear-gradient(160deg, #fce8f0 0%, #fef3f7 50%, #fce4ec 100%);
            animation: bgBreath 8s ease-in-out infinite;
        }
        @keyframes bgBreath {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        /* Soft blob shapes */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            animation: blobMove 15s ease-in-out infinite;
        }
        .blob-1 { width: 350px; height: 350px; background: #f7b8ce; top: -80px; left: -80px; animation-duration: 18s; }
        .blob-2 { width: 280px; height: 280px; background: #ffd6e7; bottom: -60px; right: -60px; animation-duration: 22s; animation-delay: -6s; }
        .blob-3 { width: 200px; height: 200px; background: #e8c4d4; top: 40%; left: 50%; animation-duration: 14s; animation-delay: -3s; }
        @keyframes blobMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(20px, -30px) scale(1.05); }
            66% { transform: translate(-15px, 20px) scale(0.95); }
        }

        /* Falling petals */
        .petal-wrap {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            top: -60px;
            font-size: 20px;
            opacity: 0;
            animation: petalFall linear infinite;
        }
        .petal:nth-child(1)  { left: 5%;  font-size: 22px; animation-duration: 9s;  animation-delay: 0s; }
        .petal:nth-child(2)  { left: 14%; font-size: 16px; animation-duration: 12s; animation-delay: 1.5s; }
        .petal:nth-child(3)  { left: 23%; font-size: 24px; animation-duration: 8s;  animation-delay: 3s; }
        .petal:nth-child(4)  { left: 35%; font-size: 14px; animation-duration: 14s; animation-delay: 0.7s; }
        .petal:nth-child(5)  { left: 48%; font-size: 20px; animation-duration: 10s; animation-delay: 2.2s; }
        .petal:nth-child(6)  { left: 57%; font-size: 18px; animation-duration: 11s; animation-delay: 4s; }
        .petal:nth-child(7)  { left: 68%; font-size: 26px; animation-duration: 7.5s;animation-delay: 1s; }
        .petal:nth-child(8)  { left: 78%; font-size: 15px; animation-duration: 13s; animation-delay: 3.5s; }
        .petal:nth-child(9)  { left: 87%; font-size: 22px; animation-duration: 9.5s;animation-delay: 0.4s; }
        .petal:nth-child(10) { left: 93%; font-size: 17px; animation-duration: 16s; animation-delay: 5s; }
        @keyframes petalFall {
            0%   { transform: translateY(-40px) rotate(0deg) translateX(0); opacity: 0; }
            10%  { opacity: 0.7; }
            80%  { opacity: 0.5; }
            100% { transform: translateY(110vh) rotate(540deg) translateX(40px); opacity: 0; }
        }

        /* Twinkling stars */
        .star-field {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .star {
            position: absolute;
            font-size: 12px;
            color: #e8849a;
            animation: starTwinkle ease-in-out infinite;
        }
        .star:nth-child(1)  { top: 6%;  left: 8%;  animation-duration: 3.2s; animation-delay: 0s; }
        .star:nth-child(2)  { top: 12%; right: 14%; animation-duration: 4.1s; animation-delay: 1.1s; font-size: 9px; }
        .star:nth-child(3)  { top: 28%; left: 4%;  animation-duration: 2.8s; animation-delay: 2s; }
        .star:nth-child(4)  { top: 22%; right: 6%; animation-duration: 5s;   animation-delay: 0.5s; font-size: 15px; }
        .star:nth-child(5)  { top: 45%; left: 92%; animation-duration: 3.7s; animation-delay: 1.8s; }
        .star:nth-child(6)  { top: 60%; left: 3%;  animation-duration: 4.4s; animation-delay: 0.3s; font-size: 10px; }
        .star:nth-child(7)  { top: 75%; right: 5%; animation-duration: 2.9s; animation-delay: 2.5s; }
        .star:nth-child(8)  { top: 88%; left: 20%; animation-duration: 3.5s; animation-delay: 0.9s; font-size: 14px; }
        .star:nth-child(9)  { top: 82%; right: 18%;animation-duration: 4.8s; animation-delay: 1.4s; font-size: 9px; }
        .star:nth-child(10) { top: 40%; left: 48%; animation-duration: 3.1s; animation-delay: 3s; font-size: 11px; }
        @keyframes starTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
            50%       { opacity: 0.9; transform: scale(1.5) rotate(30deg); }
        }

        /* ──── LOADING SCREEN ──── */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #fde4ec 0%, #fef4f7 50%, #fff8fa 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.9s ease, visibility 0.9s ease;
            opacity: 1;
            visibility: visible;
        }
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 24px;
        }
        .loader-ring::before, .loader-ring::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        .loader-ring::before {
            inset: 0;
            border-top-color: #e8849a;
            border-right-color: #e8849a;
            animation: spin 1.4s linear infinite;
        }
        .loader-ring::after {
            inset: 10px;
            border-bottom-color: #f9c5d1;
            border-left-color: #f9c5d1;
            animation: spin 1s linear infinite reverse;
        }
        .loader-heart-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.2); }
        }
        .loader-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #c9556b;
            letter-spacing: 2px;
            animation: loaderGlow 1.8s ease-in-out infinite;
        }
        .loader-dots {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .loader-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e8849a;
            animation: dotPop 1.4s ease-in-out infinite;
        }
        .loader-dots span:nth-child(2) { animation-delay: 0.2s; background: #f9c5d1; }
        .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPop {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40%            { transform: scale(1.4); opacity: 1; }
        }
        @keyframes loaderGlow {
            0%, 100% { text-shadow: 0 0 5px rgba(201,85,107,0.3); }
            50%       { text-shadow: 0 0 20px rgba(201,85,107,0.8); }
        }

        /* ──── MAIN CONTENT ──── */
        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }
        .main-container.ready {
            opacity: 1;
            transform: translateY(0);
        }

        /* Title */
        .title-wrap {
            text-align: center;
            line-height: 1.5;
        }
        .title-main {
            display: block;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--deep-rose);
            letter-spacing: 1px;
            animation: titleReveal 1.2s cubic-bezier(0.34,1.56,0.64,1) both;
            background: linear-gradient(135deg, #c9556b, #e8849a, #d4607a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 8px rgba(201,85,107,0.3));
        }
        .title-sub {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-light);
            letter-spacing: 3px;
            margin-top: 6px;
            animation: titleReveal 1.2s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes titleReveal {
            from { opacity: 0; transform: translateY(-16px) scale(0.9); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .heart-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 8px;
        }
        .heart-row span {
            font-size: 1.4rem;
            animation: heartFloat 2s ease-in-out infinite;
            display: inline-block;
        }
        .heart-row span:nth-child(1) { animation-delay: 0s; }
        .heart-row span:nth-child(2) { animation-delay: 0.3s; animation-duration: 2.4s; font-size: 1.8rem; }
        .heart-row span:nth-child(3) { animation-delay: 0.6s; }
        @keyframes heartFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50%       { transform: translateY(-6px) scale(1.15); }
        }

        /* Image wrapper */
        .image-wrapper {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(135deg, #fde8ee, #fef0f5);
            position: relative;
            opacity: 0;
            transform: scale(0.88) translateY(20px);
            transition: opacity 0.7s cubic-bezier(0.34,1.56,0.64,1),
                        transform 0.7s cubic-bezier(0.34,1.56,0.64,1),
                        box-shadow 0.5s ease;
            pointer-events: none;
        }
        .image-wrapper.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            box-shadow:
                0 0 0 2px rgba(232,132,154,0.3),
                0 0 30px rgba(232,132,154,0.4),
                0 12px 40px rgba(201,85,107,0.25);
            animation: imageGlow 3s ease-in-out infinite;
        }
        @keyframes imageGlow {
            0%, 100% { box-shadow: 0 0 0 2px rgba(232,132,154,0.3), 0 0 25px rgba(232,132,154,0.3), 0 10px 35px rgba(201,85,107,0.2); }
            50%       { box-shadow: 0 0 0 3px rgba(232,132,154,0.5), 0 0 50px rgba(255,150,180,0.5), 0 15px 50px rgba(201,85,107,0.35); }
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }
        .image-wrapper.visible img {
            animation: imgBreath 5s ease-in-out infinite;
        }
        @keyframes imgBreath {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.03); }
        }

        /* Shimmer overlay on image */
        .image-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                130deg,
                transparent 0%,
                rgba(255,255,255,0.18) 40%,
                transparent 60%
            );
            background-size: 200% 200%;
            animation: imageShimmer 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes imageShimmer {
            0%, 100% { background-position: -100% -100%; }
            50%       { background-position: 200% 200%; }
        }

        /* Placeholder inside image */
        .img-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 500;
            transition: opacity 0.4s ease;
        }
        .img-placeholder .big-icon {
            font-size: 3rem;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        .image-wrapper.visible .img-placeholder { opacity: 0; }

        /* ──── BUTTON ──── */
        .btn-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            animation: cardEntrance 1s 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        .btn-glow {
            position: relative;
            background: linear-gradient(135deg, #e8849a 0%, #d4607a 50%, #c9556b 100%);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 17px 60px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
            box-shadow: 0 8px 30px rgba(201,85,107,0.45), 0 2px 8px rgba(201,85,107,0.25);
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            animation: btnIdle 2.5s ease-in-out infinite;
            overflow: hidden;
        }

        /* Ripple inside button */
        .btn-glow::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 63px;
            background: transparent;
            border: 2px solid rgba(232,132,154,0.6);
            animation: ringExpand 2s ease-out infinite;
            pointer-events: none;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 70px;
            background: transparent;
            border: 1.5px solid rgba(232,132,154,0.3);
            animation: ringExpand 2s 0.5s ease-out infinite;
            pointer-events: none;
        }
        @keyframes ringExpand {
            0%   { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.18); opacity: 0; }
        }
        @keyframes btnIdle {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 30px rgba(201,85,107,0.45); }
            50%       { transform: scale(1.035); box-shadow: 0 12px 40px rgba(201,85,107,0.65); }
        }

        /* Shine sweep inside button */
        .btn-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                110deg,
                transparent 20%,
                rgba(255,255,255,0.35) 50%,
                transparent 80%
            );
            background-size: 200% 100%;
            animation: btnShine 3s linear infinite;
            pointer-events: none;
            border-radius: 60px;
        }
        @keyframes btnShine {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .btn-glow:hover {
            animation: none;
            transform: translateY(-4px) scale(1.06);
            box-shadow: 0 16px 45px rgba(201,85,107,0.6), 0 4px 16px rgba(201,85,107,0.3);
        }
        .btn-glow:active {
            transform: scale(0.94) !important;
            box-shadow: 0 4px 16px rgba(201,85,107,0.4) !important;
            transition: all 0.1s ease !important;
        }

        /* Decorative bottom text */
        .footer-love {
            font-size: 0.85rem;
            color: var(--text-light);
            letter-spacing: 2px;
            opacity: 0.7;
            animation: cardEntrance 1s 1s cubic-bezier(0.34,1.56,0.64,1) both;
        }

        /* ──── FLYING HEARTS ──── */
        .fly-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: flyUp ease-out forwards;
        }
        @keyframes flyUp {
            0%   { transform: translate(0,0) scale(0.5) rotate(0deg);   opacity: 1; }
            50%  { transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(25deg); opacity: 0.9; }
            100% { transform: translate(var(--tx2), var(--ty2)) scale(0) rotate(60deg); opacity: 0; }
        }

        /* ──── CONFETTI burst ──── */
        .confetti-dot {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            border-radius: 50%;
            animation: confettiFly ease-out forwards;
        }
        @keyframes confettiFly {
            0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--dr)); opacity: 0; }
        }

        /* ──── RESPONSIVE ──── */
        @media (max-width: 360px) {
            .title-main { font-size: 1.7rem; }
            .btn-glow { font-size: 1.15rem; padding: 15px 44px; }
        }
        @media (min-width: 400px) {
            .title-main { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader-ring">
            <div class="loader-heart-center">💗</div>
        </div>
        <div class="loader-title">من أجلك</div>
        <div class="loader-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Background -->
    <div class="bg-canvas">
        <div class="bg-gradient"></div>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Falling petals -->
    <div class="petal-wrap" aria-hidden="true">
        <span class="petal">🌸</span>
        <span class="petal">🌷</span>
        <span class="petal">🌸</span>
        <span class="petal">🩷</span>
        <span class="petal">🌸</span>
        <span class="petal">💮</span>
        <span class="petal">🌸</span>
        <span class="petal">🌷</span>
        <span class="petal">🌸</span>
        <span class="petal">🩷</span>
    </div>

    <!-- Twinkling stars -->
    <div class="star-field" aria-hidden="true">
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">♡</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">♡</span>
        <span class="star">✧</span>
    </div>

    <!-- Main content -->
    <div class="main-container" id="mainContainer">

        <div class="title-wrap">
            <span class="title-main">أتمنى أن تبتهجي</span>
            <span class="title-sub">لأنّكِ تستحقين كل الفرح</span>
            <div class="heart-row">
                <span>🌸</span>
                <span>💗</span>
                <span>🌸</span>
            </div>
        </div>

        <div class="image-wrapper" id="imageWrapper">
            <div class="img-placeholder">
                <span class="big-icon">🌸</span>
                <span>اضغطي لكشف الصورة</span>
            </div>
            <img id="theImage" src="flowers.jpeg" alt="صورة جميلة" loading="eager" style="display:none;">
        </div>

        <div class="btn-wrap">
            <button class="btn-glow" id="magicButton" aria-label="اضغطي هنا">
                <span class="btn-shine"></span>
                <span id="btnText">اضغطي هنا 🌸</span>
            </button>
        </div>

        <div class="footer-love">✦ &nbsp; بكل المحبة &nbsp; ✦</div>

    </div>

    <script>
    (function () {
        const loadingEl   = document.getElementById('loadingScreen');
        const container   = document.getElementById('mainContainer');
        const wrapper     = document.getElementById('imageWrapper');
        const btn         = document.getElementById('magicButton');
        const btnText     = document.getElementById('btnText');
        const img         = document.getElementById('theImage');
        let visible       = false;
        const IMG_SRC     = 'flowers.jpeg';

        /* ── helpers ── */
        function rand(min, max) { return Math.random() * (max - min) + min; }

        /* ── Flying hearts burst ── */
        function spawnHearts(cx, cy, count) {
            const emojis = ['💗','🌸','💖','✨','🩷','💝','🌷','✦'];
            for (let i = 0; i < count; i++) {
                const el  = document.createElement('span');
                el.className = 'fly-heart';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.cssText = `
                    left: ${cx + rand(-30,30)}px;
                    top:  ${cy + rand(-15,15)}px;
                    font-size: ${rand(14,30)}px;
                    --tx:  ${rand(-80,80)}px;
                    --ty:  ${rand(-80,-30)}px;
                    --tx2: ${rand(-120,120)}px;
                    --ty2: ${rand(-180,-80)}px;
                    animation-duration: ${rand(0.8,1.4)}s;
                `;
                document.body.appendChild(el);
                el.addEventListener('animationend', () => el.remove());
                setTimeout(() => el.parentNode && el.remove(), 1600);
            }
        }

        /* ── Confetti burst ── */
        function spawnConfetti(cx, cy) {
            const colors = ['#e8849a','#f9c5d1','#d4607a','#ffd6e7','#e8c49a','#c9556b'];
            for (let i = 0; i < 22; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-dot';
                const size = rand(5, 11);
                el.style.cssText = `
                    left: ${cx}px; top: ${cy}px;
                    width: ${size}px; height: ${size}px;
                    background: ${colors[Math.floor(Math.random()*colors.length)]};
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    --dx: ${rand(-130,130)}px;
                    --dy: ${rand(-130,80)}px;
                    --dr: ${rand(-360,360)}deg;
                    animation-duration: ${rand(0.6,1.1)}s;
                `;
                document.body.appendChild(el);
                el.addEventListener('animationend', () => el.remove());
                setTimeout(() => el.parentNode && el.remove(), 1200);
            }
        }

        /* ── Toggle image ── */
        function getCenter() {
            const r = btn.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        function toggleImage(e) {
            if (e) e.preventDefault();
            const { x, y } = getCenter();
            visible = !visible;

            if (visible) {
                img.style.display = 'block';
                img.src = IMG_SRC;
                wrapper.classList.add('visible');
                btnText.textContent = 'إخفاء الصورة 🌷';
                btn.style.background = 'linear-gradient(135deg,#c0a8b8 0%,#a8889a 50%,#9a7888 100%)';
                spawnHearts(x, y, 22);
                spawnConfetti(x, y);
            } else {
                wrapper.classList.remove('visible');
                btnText.textContent = 'اضغطي هنا 🌸';
                btn.style.background = '';
                spawnHearts(x, y, 12);
            }
        }

        btn.addEventListener('click', toggleImage);
        btn.addEventListener('touchend', function(e) { e.preventDefault(); toggleImage(e); });
        btn.addEventListener('touchstart', function(e) { e.preventDefault(); });

        /* ── Loading screen ── */
        function hideLoader() {
            loadingEl.classList.add('hidden');
            setTimeout(() => container.classList.add('ready'), 450);
            setTimeout(() => { if (loadingEl.parentNode) loadingEl.style.display = 'none'; }, 1000);
        }

        const t0 = Date.now();
        window.addEventListener('load', function () {
            const wait = Math.max(0, 2600 - (Date.now() - t0));
            setTimeout(hideLoader, wait);
        });
        setTimeout(function () {
            if (!loadingEl.classList.contains('hidden')) hideLoader();
        }, 3800);
    })();
    </script>
</body>
</html>
